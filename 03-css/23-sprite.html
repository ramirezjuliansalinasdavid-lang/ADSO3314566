<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>23-Sprite</title>
    <link rel="stylesheet" href="../src/css/03-template.css">
    <style>
        div#sprite {
            background: url(img/anim-sprite.png)no-repeat;
            height: 256px;
            margin: 1rem auto;
            width: 256px;
        }

        div#sprite.sp1 {
            background-position: calc(-256px * 0) 0;
        }

        div#sprite.sp2 {
            background-position: calc(-256px * 1) 0;
        }

        div#sprite.sp3 {
            background-position: calc(-256px * 2) 0;
        }

        div#sprite.sp4 {
            background-position: calc(-256px * 3) 0;
        }

        div#sprite.sp5 {
            background-position: calc(-256px * 4) 0;
        }

        div#sprite.sp6 {
            background-position: calc(-256px * 5) 0;
        }

        div#sprite2 {
            background: url(img/sprite.png)no-repeat;
            height: 233px;
            margin: 1rem auto;
            width: 233px;
        }

        div#sprite2.sp1 {
            background-position: calc(-233px * 0) 0;
        }

        div#sprite2.sp2 {
            background-position: calc(-233px * 1) 0;
        }

        div#sprite2.sp3 {
            background-position: calc(-233px * 2) 0;
        }

        div#sprite2.sp4 {
            background-position: calc(-233px * 3) 0;
        }

        div#sprite2.sp5 {
            background-position: calc(-233px * 4) 0;
        }

        div#sprite2.sp6 {
            background-position: calc(-233px * 5) 0;
        }
    </style>
</head>

<body>
    <a href="../03-css/index_4.html" class="btn-home">
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="#000000" viewBox="0 0 256 256">
            <path
                d="M224,128a8,8,0,0,1-8,8H59.31l58.35,58.34a8,8,0,0,1-11.32,11.32l-72-72a8,8,0,0,1,0-11.32l72-72a8,8,0,0,1,11.32,11.32L59.31,120H216A8,8,0,0,1,224,128Z">
            </path>
        </svg> </a>
    <main>
        <header>
            <h1>23-Sprite</h1>
            <h2>Un sprite de imagen es una colección de imágenes agrupadas en una sola imagen.</h2>
        </header>
        <section>
            <div id="sprite" class="sp1"></div>
            <div id="sprite2" class="sp1"></div>
        </section>
    </main>
    <script>
        const sprite = document.getElementById('sprite')
        const numSprite = 6
        let count = 1
        setInterval(() => {
            sprite.className = ''
            sprite.classList.add('sp' + count)
            if (count == numSprite) count = 1
            else count++
        }, 80)

        // Control para sprite2
        const sprite2 = document.getElementById('sprite2')
        const numSprite2 = 6
        let count2 = 1

        setInterval(() => {
            sprite2.className = ''
            sprite2.classList.add('sp' + count2)
            if (count2 == numSprite2) count2 = 1
            else count2++
        }, 80)
    </script>
</body>

</html>
