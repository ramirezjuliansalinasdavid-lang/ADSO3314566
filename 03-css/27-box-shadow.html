<!---->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>27-Box Shadow</title>
    <link rel="stylesheet" href="../src/css/03-template.css">
    <style>
        .demo-box {
            background: rgba(0, 0, 0, 0.1);
        }

        .demo-box h3 {
            color: white;
        }

        .box-shadow-demo {
            width: 150px;
            height: 150px;
            background: black;
            border-radius: 12px;
            box-shadow: 0 0 12px #fff;
            margin: 0 auto;
        }

        .box-shadow-demo-2 {
            width: 150px;
            height: 150px;
            background: black;
            border-radius: 12px;
            box-shadow: -10px -10px 24px 0 #fff;
            margin: 0 auto;
        }

        .box-shadow-demo-3 {
            width: 150px;
            height: 150px;
            background: black;
            border-radius: 12px;
            box-shadow: 0 0 20px #fff inset;
            margin: 0 auto;
        }

        .box-shadow-demo-4 {
            width: 150px;
            height: 150px;
            background: black;
            border-radius: 12px;
            box-shadow: 4px 4px 0 4px #cc0, 8px 8px 0 6px #00c, 12px 12px 0 8px #c00;
            margin: 0 auto;
        }

        .image-demo {
            text-align: center;
            padding: 10px;
            flex: 1;
        }

        .image-demo img {
            width: 100%;
            max-width: 200px;
            height: auto;
            object-fit: cover;
            border-radius: 12px;
            box-shadow: 0 0 15px #fff;
        }

        .image-demo2 {
            text-align: center;
            padding: 10px;
            flex: 1;
        }

        .image-demo2 img {
            width: 100%;
            max-width: 200px;
            height: auto;
            object-fit: cover;
            border-radius: 12px;
            filter: drop-shadow(0 0 10px #fff);
        }

        .images-container {
            display: flex;
            gap: 30px;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            padding: 20px;
        }
    </style>
</head>

<body>
    <a href="../03-css/index_4.html" class="btn-home">
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="#000000" viewBox="0 0 256 256">
            <path
                d="M224,128a8,8,0,0,1-8,8H59.31l58.35,58.34a8,8,0,0,1-11.32,11.32l-72-72a8,8,0,0,1,0-11.32l72-72a8,8,0,0,1,11.32,11.32L59.31,120H216A8,8,0,0,1,224,128Z">
            </path>
        </svg> </a>
    <main>
        <header>
            <h1>27-Box Shadow</h1>
            <h2>Esta propiedad adjunta una o más sombras a un elemento.</h2>
        </header>
        <section>
            <div class="demo-box">
                <h3>🎨 Box Shadow: 0 0 12px #fff</h3>
                <div class="box-shadow-demo"></div>
            </div>
            <div class="demo-box">
                <h3>🎨 Box Shadow: -10px -10px 24px 0 #fff</h3>
                <div class="box-shadow-demo-2"></div>
            </div>
            <div class="demo-box">
                <h3>🎨 Box Shadow: 0 0 20px #fff inset</h3>
                <div class="box-shadow-demo-3"></div>
            </div>
            <div class="demo-box">
                <h3>🎨 Box Shadow: Multiple</h3>
                <div class="box-shadow-demo-4"></div>
            </div>
            <div class="demo-box">
                <h3>🎨 Box Shadow: Imagen</h3>
                <div class="images-container">
                <div class="image-demo">
                    <img src="../03-css/img/mario2.png" alt="Mario">
                </div>
                <div class="image-demo2">
                    <img src="../03-css/img/mario2.png" alt="Mario">
                </div>
                </div>
            </div>
        </section>
    </main>
</body>

</html>
