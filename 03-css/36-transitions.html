<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>36-Transition</title>
    <link rel="stylesheet" href="../src/css/03-template.css">
    <style>
        .demo-box {
            background: rgba(0, 0, 0, 0.1);       
        }

        .demo-box h3 {
            text-align: center;
            color: #fff;
        }

        .demo-box section img {
            display: block;
            margin: 0 auto;
        }

        main section {
            img {
                border: none;
                border-radius: 0;
                filter: drop-shadow(0 0 12px #fff);
            }
            img.transition01 {
                transition: transform 0.5s ease-in;
                &:hover {
                    transform: scale(1.1);
                }
            }
            img.transition02 {
                transition: transform 1s ease-out;
                &:hover {
                    transform: rotate(-360deg);
                }
            }
            img.transition03 {
                transition: transform 1s ease-in-out;
                &:hover {
                    transform: rotateY(360deg);
                }
            }
            img.transition04 {
                transition: transform 0.5s ease-out;
                &:hover {
                    transform: translate(100px)
                }
            }
            .demo-box2 {
                background-color: #121111;
                height: 80px;
                margin-block: 2rem;
                width: 80px;
                transition: width 1s,
                            height 1s 1s,
                            background-color 2s 1s;
                &:hover {
                    background-color: #db0e0e;
                    width: 300px;
                    height: 160px;
                }
            }
        }
    </style>
</head>
<body>
    <a href="../03-css/index_4.html" class="btn-home">
    <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="#000000" viewBox="0 0 256 256">
        <path
            d="M224,128a8,8,0,0,1-8,8H59.31l58.35,58.34a8,8,0,0,1-11.32,11.32l-72-72a8,8,0,0,1,0-11.32l72-72a8,8,0,0,1,11.32,11.32L59.31,120H216A8,8,0,0,1,224,128Z">
        </path>
    </svg> </a>
    <main>
        <header>
            <h1>36-Transition</h1>
            <h2>Le permite definir la transición entre dos estados de un elemento.</h2>
        </header>
        <div class="demo-box">
            <section>
                <h3>Scale(1.4):</h3>
                <img class="transition01" src="img/dk.png" alt="DK">
            </section>
            <section>
                <h3>Rotate(-180deg):</h3>
                <img class="transition02" src="img/dk.png" alt="DK">
            </section>
            <section>
                <h3>RotateY(180deg):</h3>
                <img class="transition03" src="img/dk.png" alt="DK">
            </section>
            <section>
                <h3>TranslateX(100px):</h3>
                <img class="transition04" src="img/dk.png" alt="DK">
            </section>
            <section>
                <div class="demo-box2">
                    <h3>Multiple</h3>
                </div>
            </section>
        </div>
    </main>
    </body>

</html>
