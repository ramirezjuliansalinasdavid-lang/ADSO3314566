<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>45-Challenge-Grid</title>
    <link rel="stylesheet" href="../src/css/03-template.css">
    <style>
        * {
            box-sizing: border-box;
        }


        h1,
        h2 {
            margin: 0 0 10px 0;
        }

        h2 {
            color: #f2f0f0;
            font-weight: normal;
        }

        .gallery {
            display: grid;

            grid-template-columns: 1fr 1fr 1fr;
            grid-template-rows: 1fr 1fr 1fr;
            gap: 12px;
            aspect-ratio: 1 / 1;
            /* Mantiene el cuadrado perfecto */

            /* MAPA DE ÁREAS (Igual que antes) */
            grid-template-areas:
                "item1 item2 item3"
                "item4 item2 item5"
                "item6 item6 item7";
        }

        /* Ahora las cajas contienen imágenes, ya no son solo colores */
        .gallery>div {
            border-radius: 12px;
            overflow: hidden;
            /* Para que la imagen respete el borde redondeado */
            position: relative;
            border: 3px solid #ffffff;
            /* Marco blanco como en la pantalla */
        }

        /* --- ESTILO DE LAS IMÁGENES --- */
        .gallery img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            /* ESTO ES FUNDAMENTAL. Hace que la imagen llene la caja sin aplastarse */
            display: block;
        }

        /* --- ASIGNACIÓN DE ÁREAS --- */
        .item-1 {
            grid-area: item1;
        }

        .item-2 {
            grid-area: item2;
        }

        .item-3 {
            grid-area: item3;
        }

        .item-4 {
            grid-area: item4;
        }

        .item-5 {
            grid-area: item5;
        }

        .item-6 {
            grid-area: item6;
        }

        .item-7 {
            grid-area: item7;
        }
    </style>
</head>

<body>
    <a href="../03-css/index_4.html" class="btn-home">
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="#000000" viewBox="0 0 256 256">
            <path
                d="M224,128a8,8,0,0,1-8,8H59.31l58.35,58.34a8,8,0,0,1-11.32,11.32l-72-72a8,8,0,0,1,0-11.32l72-72a8,8,0,0,1,11.32,11.32L59.31,120H216A8,8,0,0,1,224,128Z">
            </path>
        </svg> </a>
    <main>
        <header>
            <h1>45-Challenge-Grid</h1>
            <h2>Galería Irregular.</h2>
        </header>
        <section class="gallery">
            <!-- Fila 1 -->
            <div class="item-1"><img src="img/goku.jpg" alt="Goku"></div>
            <div class="item-2"><img src="img/goku2.jpg" alt="Goku"></div>
            <div class="item-3"><img src="img/vg.jpg" alt="vg"></div>

            <!-- Fila 2 -->
            <div class="item-4"><img src="img/kakaroto.jpg" alt="Kakaroto"></div>
            <!-- Nota: El elemento 2 ya está arriba, pero el CSS lo estira hasta aquí -->
            <div class="item-5"><img src="img/z.jpg" alt="Z"></div>

            <!-- Fila 3 -->
            <div class="item-6"><img src="img/dragonball.jpg" alt="Dragon Ball"></div>
            <div class="item-7"><img src="img/sj4.jpg" alt="Sj4"></div>
        </section>
    </main>
</body>

</html>
