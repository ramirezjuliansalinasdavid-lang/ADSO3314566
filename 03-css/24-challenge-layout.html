<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sprite - Galería de Imágenes Sprite</title>
    <style>
        main {
            background-color: #17a053;
            border: 4px solid #fff;
            min-height: 100dvh;
            padding: 40px 20px;

            div.logo {
                background: url(img/spriteweb.png) no-repeat;
                background-position: -20px -434px;
                height: 120px;
                margin: 1rem auto;
                width: 162px;
            }
        }

        .nav-menu {
            text-align: center;
            margin: 40px 0;
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .nav-menu a {
            background-color: rgba(0, 0, 0, 0.4);
            color: white;
            padding: 1rem;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 120px;
            text-decoration: none;
            border-bottom: 7px white solid;
            text-transform: uppercase;
        }
    </style>
</head>

<body>
    <main>
        <div class="logo"></div>
        <div class="nav-menu">
            <a href="#">INICIO</a>
            <a href="#">NOSOTROS</a>
            <a href="#">PORTAFOLIO</a>
            <a href="#">SERVICIOS</a>
            <a href="#">CONTACTO</a>
        </div>
        <div class="sprites-section">
            <div class="sprites-container">
                <div class="sprite-card">
                    <div class="sprite-01"></div>
                    <h3>Sprite 01</h3>
                </div>
                <div class="sprite-card">
                    <div class="sprite-02"></div>
                    <h3>Sprite 02</h3>
                </div>
                <div class="sprite-card">
                    <div class="sprite-03"></div>
                    <h3>Sprite 03</h3>
                </div>
            </div>
        </div>
    </main>
</body>

</html>
