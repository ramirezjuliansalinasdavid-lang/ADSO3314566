<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>16-Float</title>
    <link rel="stylesheet" href="../src/css/03-template.css">
    <style>
        .position-grid {
            display: flex;
            flex-direction: column;
            gap: 2rem;
            margin: 2rem 0;
        }

        .position-card {
            background: rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(4px);
            border-radius: 1.8rem;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.25);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .position-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 25px -12px rgba(0, 0, 0, 0.4);
            border-color: rgba(255, 255, 255, 0.5);
        }

        .card-header {
            background: rgba(0, 0, 0, 0.6);
            padding: 0.8rem 1.5rem;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: baseline;
            gap: 10px;
            border-bottom: 2px solid rgba(255, 255, 255, 0.2);
        }

        .card-header h4 {
            font-size: 1.3rem;
            font-weight: 700;
            color: white;
            margin: 0;
        }

        .css-badge {
            font-family: 'Courier New', monospace;
            background: #1e1e2e;
            padding: 0.2rem 1rem;
            border-radius: 30px;
            font-size: 0.75rem;
            color: #a5d6ff;
            border-left: 3px solid #6c5ce7;
        }

        .demo-container {
            margin: 1.5rem;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 1.2rem;
            padding: 1rem;
            border: 1px dashed rgba(255, 255, 255, 0.3);
        }

        .position-box {
            width: 120px;
            height: 120px;
            background: linear-gradient(135deg, #6c5ce7, #a29bfe);
            border-radius: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-weight: bold;
            color: white;
            font-size: 0.8rem;
            box-shadow: 0 10px 15px -5px rgba(0, 0, 0, 0.3);
            cursor: pointer;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            transition: all 0.3s ease;
        }

        .explanation {
            padding: 0.5rem 1.5rem 1.5rem 1.5rem;
            color: rgba(255, 255, 255, 0.85);
            font-size: 0.85rem;
            line-height: 1.5;
            border-top: 1px solid rgba(255, 255, 255, 0.15);
        }

        .explanation strong {
            color: #ffd93d;
        }

        .static-demo .position-box {
            position: static;
            margin: 0 auto;
        }

        .relative-demo .position-box {
            position: relative;
            top: 20px;
            left: 30px;
            background: linear-gradient(135deg, #00b894, #55efc4);
        }

        .absolute-container {
            position: relative;
            min-height: 220px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 1rem;
            padding: 1rem;
        }

        .absolute-demo .position-box {
            position: absolute;
            bottom: 15px;
            right: 20px;
            background: linear-gradient(135deg, #ff7675, #d63031);
            width: 100px;
            height: 100px;
        }

        .fixed-demo .position-box {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 110px;
            height: 110px;
            background: linear-gradient(135deg, #fdcb6e, #f39c12);
            z-index: 1000;
            font-size: 0.7rem;
        }

        .fixed-note {
            background: #ff7675;
            border-radius: 0.8rem;
            padding: 0.8rem;
            text-align: center;
            font-size: 0.75rem;
        }

        .fake-fixed {
            position: sticky;
            bottom: 0;
            background: #f39c12;
            margin-top: 10px;
            padding: 8px;
            border-radius: 30px;
            text-align: center;
            font-weight: bold;
        }

        .sticky-scroll-container {
            max-height: 250px;
            overflow-y: auto;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 1rem;
            padding: 1rem;
            position: relative;
        }

        .sticky-header {
            position: sticky;
            top: 0;
            background: #6c5ce7;
            padding: 10px;
            border-radius: 0.8rem;
            text-align: center;
            font-weight: bold;
            color: white;
            z-index: 10;
            margin-bottom: 10px;
        }

        .sticky-content {
            height: 300px;
            background: repeating-linear-gradient(45deg, rgba(255, 255, 255, 0.05) 0px, rgba(255, 255, 255, 0.05) 20px, transparent 20px, transparent 40px);
            border-radius: 0.6rem;
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(255, 255, 255, 0.7);
        }

        .fixed-note {
            background: #ff7675;
            border-radius: 0.8rem;
            padding: 0.8rem;
            text-align: center;
            font-size: 0.75rem;
        }

        .fake-fixed {
            position: sticky;
            bottom: 0;
            background: #f39c12;
            margin-top: 10px;
            padding: 8px;
            border-radius: 30px;
            text-align: center;
            font-weight: bold;
        }

        .note-icon {
            font-size: 0.7rem;
            background: rgba(0, 0, 0, 0.4);
            display: inline-block;
            padding: 2px 8px;
            border-radius: 30px;
        }

        button.small-reset {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            border-radius: 30px;
            padding: 4px 12px;
            color: white;
            margin-top: 8px;
            cursor: pointer;
            font-size: 0.7rem;
        }

        button.small-reset:hover {
            background: #6c5ce7;
        }
    </style>
</head>

            </path>
        </svg> </a>
    <main>
        <header>
            <h1>16-Float</h1>

</body>

</html>
