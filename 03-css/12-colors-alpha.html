<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>12-Colors-Alpha</title>
    <link rel="stylesheet" href="../src/css/03-template.css">
    <style>
        h3 {
            text-align: center;
            color: blueviolet;
            font-family: 'Poppins', sans-serif;
        }

        figure.mario{
            background: url(img/Mario.png) no-repeat center /contain;
            border: 4px solid #fff;
            margin-block: 4rem;
            width: 450px;
            height: 450px;
            div{
                height: calc(450px/3);
                &.box1 {
                    background-color: rgba(18, 17, 17, 0.8);
                }
                &.box2 {
                    background-color: #13131377;
                }
                &.box3 {
                    background-color: hsla(0, 0%, 3%, 0.5);
                }
            }
        }
    </style>
</head>

<body>
    <a href="../03-css/index_4.html" class="btn-home">
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="#000000" viewBox="0 0 256 256">
            <path
                d="M224,128a8,8,0,0,1-8,8H59.31l58.35,58.34a8,8,0,0,1-11.32,11.32l-72-72a8,8,0,0,1,0-11.32l72-72a8,8,0,0,1,11.32,11.32L59.31,120H216A8,8,0,0,1,224,128Z">
            </path>
        </svg> </a>
    <main>
        <header>
            <h1>12-Colors-Alpha</h1>
            <h2>
                El cuarto canal alfa permite aplicar opacidad o transparencia al color.</h2>
        </header>
        <section>
            <h3>Ejemplo de color transparente</h3>
            <figure class="mario">
                <div class="box1"></div>
                <div class="box2"></div>
                <div class="box3"></div>
            </figure>
        </section>
    </main>
</body>

</html>
