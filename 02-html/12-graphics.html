<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>12-graphics</title>
    <link rel="stylesheet" href="../src/css/00-template.css">
</head>

<style>
    
    canvas,
    svg {
        width: 100%;
        height: auto;
    }

</style>

<body>
    <a href="index_3.html" class="btn-home">
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="#000000" viewBox="0 0 256 256">
            <path
                d="M224,128a8,8,0,0,1-8,8H59.31l58.35,58.34a8,8,0,0,1-11.32,11.32l-72-72a8,8,0,0,1,0-11.32l72-72a8,8,0,0,1,11.32,11.32L59.31,120H216A8,8,0,0,1,224,128Z">
            </path>
        </svg> </a>
    <main>
        <header>
            <h1>12-Graphics</h1>
            <h2>Crea graficos en linea con etiquetas</h2>
        </header>
        <section>
            <h3>CANVAS</h3>
            <canvas id="miCanvas" width="350" height="150"
                style="border: 2px solid #1e1e2f; background: #f16529; display: block; margin: 10px; width: 100%; height: auto; max-width: 350px;">
                Tu navegador no soporta canvas.
            </canvas>
            <h3>SVG</h3>
            <svg width="350" height="150" xmlns="http://www.w3.org/2000/svg"
                style="border: 1px solid #1e1e2f; margin: 10px; background: #f16529; width: 100%; height: auto; max-width: 350px;">
                <circle cx="175" cy="75" r="50" fill="#e74c3c" stroke="#c0392b" stroke-width="5" fill-opacity="0.8" />
                <text x="175" y="80" fill="white" font-size="15" font-family="Federant" text-anchor="middle"
                    font-weight="bold">Círculo</text>
            </svg>
        </section>
    </main>
    <script>
        const canvas = document.getElementById('miCanvas');
        const ctx = canvas.getContext('2d');

        // Las coordenadas siguen siendo las mismas porque el canvas tiene un tamaño de dibujo fijo (350x150)
        ctx.beginPath();
        ctx.arc(175, 75, 50, 0, 2 * Math.PI);
        ctx.fillStyle = '#2a2a40';
        ctx.fill();
        ctx.strokeStyle = '#c0392b';
        ctx.lineWidth = 5;
        ctx.stroke();
        ctx.fillStyle = 'white';
        ctx.font = 'bold 15px Federant';
        ctx.textAlign = 'center';
        ctx.fillText('Círculo', 175, 82);
    </script>
</body>

</html>
