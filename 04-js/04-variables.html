<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>04-Variables</title>
    <link rel="stylesheet" href="../src/css/04-template.css">
</head>

<body>
    <a href="../04-js/index_5.html" class="btn-home">
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="#000000" viewBox="0 0 256 256">
            <path
                d="M224,128a8,8,0,0,1-8,8H59.31l58.35,58.34a8,8,0,0,1-11.32,11.32l-72-72a8,8,0,0,1,0-11.32l72-72a8,8,0,0,1,11.32,11.32L59.31,120H216A8,8,0,0,1,224,128Z">
            </path>
        </svg> </a>
    <main>
        <header>
            <h1>04-Variables</h1>
            <h2>Almacena y gestiona datos usando variables.</h2>
        </header>
        <section>
            <h3>Type String:    <small class="type-string"></small></h3>
            <h3>Type Number:    <small class="type-number"></small></h3>
            <h3>Type Boolean:   <small class="type-boolean"></small></h3>
            <h3>Type Null:      <small class="type-null"></small></h3>
            <h3>Type Undefined: <small class="type-undefined"></small></h3>
            <h3>Type Array:     <small class="type-array"></small></h3>
            <h3>Type Object:    <small class="type-object"></small></h3>
        </section>
    </main>

    <script>
        //Type String
        const tstring = document.querySelector('.type-string')
        const message = 'Hola JS 👌'
        tstring.textContent = `${message} - Length:
                                ${message.length} characters`

        //Type Number
        const tnumber = document.querySelector('.type-number')
        const num1 = 45
        const num2 = 12.4
        tnumber.textContent  = `(45+12.4) -> ${num1 + num2} `

        //Type Boolean
        const tboolean = document.querySelector('.type-boolean')
        const isTrue = (4>8)
        tboolean.textContent = `(4>8) -> ${isTrue}` 

        //Type Null 
        const tnull = document.querySelector('.type-null')
        const isCreated = null
        tnull.textContent = `isCreated -> ${isCreated}`

        //Type Undefined
        const tundefined = document.querySelector('.type-undefined')
        const isBinary = undefined
        tundefined.textContent = `isBinary -> ${isBinary}`

        //Type Array
        const tarray = document.querySelector('.type-array')
        const landscapes = ['🏙️', '🌆', '🏞️', '🛣️']
        tarray.textContent = `Landscapes -> ${landscapes}`

        //Type Object
        const tobject = document.querySelector('.type-object')
        const hashira = {
            name: 'Kyojuro Rengoku',
            type: '🔥',
            age: 20
        }
        tobject.textContent = `${hashira.name} -> ${hashira.type} -> ${hashira.age}`
    </script> 
</body>
</html>
