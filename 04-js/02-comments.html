<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>02-Comments</title>
    <link rel="stylesheet" href="../src/css/04-template.css">
</head>

<body>
    <a href="../02-html/index.html" class="btn-home">
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="#000000" viewBox="0 0 256 256">
            <path
                d="M224,128a8,8,0,0,1-8,8H59.31l58.35,58.34a8,8,0,0,1-11.32,11.32l-72-72a8,8,0,0,1,0-11.32l72-72a8,8,0,0,1,11.32,11.32L59.31,120H216A8,8,0,0,1,224,128Z">
            </path>
        </svg> </a>
    <main>
        <header>
            <h1>02-Comments</h1>
            <h2>Añade comentarios para explicar o anotar tu código.</h2>
        </header>
        <section>
            <h3>Digital Time</h3>
            <h2 id="time">00:00:00</h2>
        </section>
    </main>
    <script>
        const time = document.getElementById('time')
        time.style.textAlign = 'center';
        time.style.zoom = '3.4';

        setInterval(function() {
            let today = new Date;
            let hours = today.getHours();
            let minutes = today.getMinutes();
            let seconds = today.getSeconds();
            time.textContent = `${hours.toString().padStart(2, '00')}:${minutes.toString().padStart(2, '00')}:${seconds.toString().padStart(2, '00')}`;
        }, 1000)
    </script>
</body>

</html>
